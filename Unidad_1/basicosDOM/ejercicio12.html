<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EJERCICIO 12: evento click</title>
  </head>
  <body>
    <button id="boton">click aquí, AHORA</button>
    <script>
      const btn = document.getElementById("boton");
      btn.addEventListener("click", () => {
        alert("El boton a muerto");
      });
    </script>
  </body>
</html>
