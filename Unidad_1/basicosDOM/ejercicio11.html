<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EJERCICIO 11: removechild</title>
  </head>
  <body>
    <div id="contenedor1">
      <div id="eliminar">eliminar</div>
    </div>
    <script>
      const elemento = document.getElementById("eliminar");
      const elementopadre = elemento.parentElement; //identifica el padre
      elementopadre.removeChild(elemento);
    </script>
  </body>
</html>
