<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EJERCICIO 5: cambio de contenido con textcontrol</title>
  </head>
  <body>
    <div id="elemento1">texto</div>
    <script>
      const elemento = document.getElementById("elemento1");
      elemento.textContent = "nuevo texto";
      elemento.style.fontFamily = "Annon";
      elemento.style.color = "red";
    </script>
  </body>
</html>
