<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <header>
          <h1>Página con DOM</h1>
        </header>
        <div class="formContainer">
          <form action="" id="taskForm" data-formulario>
            <input
              type="text"
              name="nombre"
              placeholder="Nombre"
              class="formulario"
              autocomplete="off"
              data-input-nombre
              required
            />
            <select name="curso" class="formulario" data-input-curso required>
              <option value="">Seleccionar curso</option>
              <option>Primero</option>
              <option>Segundo</option>
              <option>Tercero</option>
              <option>Cuarto</option>
              <option>Quinto</option>
              <option>Sexto</option>
              <option>Septimo</option>
              <option>Octavo</option>
            </select>
            <input
              type="number"
              name="edad"
              placeholder="Edad"
              class="formulario"
              data-input-edad
              required
              min="0"
              max="100"
            />
            <input
              type="number"
              name="nhermanos"
              placeholder="Número de hermanos"
              class="formulario"
              data-input-hermanos
              required
              min="0"
              max="20"
            />
            <input
              type="text"
              name="ciudad"
              placeholder="Ciudad de nacimiento"
              class="formulario"
              autocomplete="off"
              data-input-ciudad
              required
            />
            <button type="submit" class="btnSubir">
              Agregar <i class="fas fa-plus-circle"></i>
            </button>
          </form>
        </div>
        <section class="resultados">
          <div class="tablaContainer">
            <h2>Lista de Tareas</h2>
            <table id="tabla">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Curso</th>
                  <th>Edad</th>
                  <th>N° Hermanos</th>
                  <th>Ciudad</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
