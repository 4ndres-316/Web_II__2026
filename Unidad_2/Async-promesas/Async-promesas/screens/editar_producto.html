<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doguito Petshop | Actualizar producto</title>

    <link rel="icon" href="../assets/img/doguitoadm.svg" />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/base/base.css" />
    <link rel="stylesheet" href="../assets/css/componentes/header.css" />
    <link rel="stylesheet" href="../assets/css/componentes/card.css" />
    <link rel="stylesheet" href="../assets/css/register_client.css" />
    <link rel="stylesheet" href="../assets/css/componentes/inputs.css" />
    <link rel="stylesheet" href="../assets/css/componentes/button.css" />
  </head>

  <body>
    <header class="header container">
      <img src="../assets/img/doguitoadm.svg" class="header__logo" />

      <nav>
        <ul class="header__list-nav">
          <li class="header__link"><a href="#">Dashboard</a></li>
          <li class="header__link">
            <a href="./lista_productos.html">Productos</a>
          </li>
          <li class="header__link">
            <a href="./lista_cliente.html">Clientes</a>
          </li>
          <li class="header__link"><a href="./lista_mascota.html">Pets</a></li>
        </ul>
      </nav>
    </header>

    <main class="container flex flex--center flex--column">
      <section class="card cadastro">
        <h1 class="card__title">Editar producto</h1>

        <form class="flex flex--column" data-form>
          <div class="input-container">
            <input class="input" type="text" required data-nombre />
            <label class="input-label">Nombre</label>
          </div>

          <div class="input-container">
            <input class="input" type="number" required data-precio />
            <label class="input-label">Precio</label>
          </div>

          <div class="input-container">
            <textarea class="input" required data-descripcion></textarea>
            <label class="input-label">Descripción</label>
          </div>

          <button type="submit" class="button">Editar producto</button>
        </form>
      </section>
    </main>

    <script type="module" src="../controllers/actualizar_producto.js"></script>
  </body>
</html>
