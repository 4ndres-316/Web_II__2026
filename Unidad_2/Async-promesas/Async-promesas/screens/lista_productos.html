<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doguito Petshop | Productos</title>

    <link rel="icon" href="../assets/img/doguitoadm.svg" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/base/base.css" />
    <link rel="stylesheet" href="../assets/css/componentes/header.css" />
    <link rel="stylesheet" href="../assets/css/lista_cliente.css" />
    <link rel="stylesheet" href="../assets/css/componentes/table.css" />
    <link rel="stylesheet" href="../assets/css/componentes/button.css" />
  </head>

  <body>
    <header class="header container">
      <img src="../assets/img/doguitoadm.svg" class="header__logo" />
      <nav>
        <ul class="header__list-nav">
          <li class="header__link"><a href="#">Dashboard</a></li>
          <li class="header__link">
            <a href="./lista_productos.html">Productos</a>
          </li>
          <li class="header__link">
            <a href="./lista_cliente.html">Clientes</a>
          </li>
          <li class="header__link"><a href="./lista_mascota.html">Pets</a></li>
        </ul>
      </nav>
    </header>

    <main class="clientes-container">
      <table class="table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Descripción</th>
            <th class="table__align--right">
              <a
                href="./registrar_producto.html"
                class="simple-button simple-button--add"
              >
                Nuevo Producto
              </a>
            </th>
          </tr>
        </thead>
        <tbody data-table></tbody>
      </table>
    </main>

    <script type="module" src="../controllers/producto_controller.js"></script>
  </body>
</html>
